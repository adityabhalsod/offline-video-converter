# Manual, versioned release.
# Run it from the Actions tab: "Release" -> "Run workflow", enter a version like 1.0.0.
# It runs the tests, builds the app for Windows, macOS and Linux with PyInstaller,
# tags the commit as v<version>, and publishes a GitHub Release with the builds attached.
# Windows gets a Setup .exe installer and a portable zip, both with FFmpeg included.
#
# Code signing (Windows): optional. When the SIGNPATH_API_TOKEN secret and the
# SIGNPATH_ORGANIZATION_ID variable are set, the app .exe and the installer are
# signed through SignPath. Without them the build is unsigned, exactly as before.
# Setup steps are in docs/CODE_SIGNING.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.0.0 or 1.1.0-beta.1)"
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create as a draft (publish it yourself from the Releases page)"
        required: false
        default: false
        type: boolean
      publish:
        description: "Publish the release (untick to only build and test; files are kept as run artifacts)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  APP_NAME: OfflineVideoConverter

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version format and that the tag is new
        id: check
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not semver (expected e.g. 1.2.3 or 1.2.3-beta.1)"
            exit 1
          fi
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Pick a new version."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  test:
    name: Tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  build:
    name: Build (${{ matrix.label }})
    needs: [validate, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
          - os: ubuntu-22.04
            label: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Stamp version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: echo "__version__ = \"$VERSION\"" > core/_version.py

      - name: Windows version info
        if: runner.os == 'Windows'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: python packaging/windows/make_version_info.py "$VERSION" build/version_info.txt

      - name: Build with PyInstaller
        shell: bash
        run: |
          SEP=":"
          EXTRA=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            SEP=";"
            EXTRA=(--icon packaging/icons/icon.ico --version-file build/version_info.txt)
          elif [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA=(--icon packaging/icons/icon.icns --osx-bundle-identifier io.github.adityabhalsod.offlinevideoconverter)
          fi
          pyinstaller main.py \
            --name "$APP_NAME" \
            --windowed \
            --noconfirm \
            --add-data "presets${SEP}presets" \
            --add-data "packaging/icons/icon.png${SEP}packaging/icons" \
            "${EXTRA[@]}"

      - name: Add icon and desktop entry (Linux)
        if: runner.os == 'Linux'
        run: |
          DEST="dist/$APP_NAME"
          cp packaging/icons/icon.png "$DEST/$APP_NAME.png"
          cp packaging/linux/offline-video-converter.desktop "$DEST/"

      - name: Bundle FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Shared GPL build from BtbN/FFmpeg-Builds: small ffmpeg.exe/ffprobe.exe plus DLLs.
          curl -fsSL -o ffmpeg.zip \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip
          7z x -y -offmpeg-src ffmpeg.zip > /dev/null
          SRC=$(echo ffmpeg-src/*/)
          DEST="dist/$APP_NAME/ffmpeg"
          mkdir -p "$DEST"
          cp "$SRC"bin/ffmpeg.exe "$SRC"bin/ffprobe.exe "$SRC"bin/*.dll "$DEST"/
          cp "$SRC"LICENSE.txt "$DEST"/FFMPEG-LICENSE.txt
          "$DEST/ffmpeg.exe" -hide_banner -version

      - name: Check for signing setup (Windows)
        id: signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Code signing is set up: the exe and installer will be signed."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Code signing is not set up, so this Windows build is unsigned. See docs/CODE_SIGNING.md."
          fi

      - name: Upload exe for signing (Windows)
        id: upload-unsigned-exe
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe-${{ matrix.label }}
          path: dist/${{ env.APP_NAME }}/${{ env.APP_NAME }}.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign exe (Windows)
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'offline-video-converter' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app-exe
          github-artifact-id: ${{ steps.upload-unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-exe

      - name: Use signed exe (Windows)
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          Copy-Item "signed-exe\$env:APP_NAME.exe" "dist\$env:APP_NAME\$env:APP_NAME.exe" -Force
          $sig = Get-AuthenticodeSignature "dist\$env:APP_NAME\$env:APP_NAME.exe"
          Write-Host "Signature: $($sig.Status) by $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Error "The exe is not validly signed"; exit 1 }

      - name: Smoke test the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = "dist\$env:APP_NAME"
          & "$app\ffmpeg\ffmpeg.exe" -hide_banner -loglevel error -y -f lavfi -i testsrc=duration=2:size=320x240:rate=30 smoke.mp4
          # Run with a PATH that has no other FFmpeg, so the bundled one must be found.
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $p = Start-Process -FilePath "$app\$env:APP_NAME.exe" `
            -ArgumentList @("thumbnail", "smoke.mp4", "smoke.jpg", "--time", "00:00:01.000") `
            -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path smoke.jpg)) {
            Write-Error "Packaged app failed (exit $($p.ExitCode))"
            exit 1
          }
          Write-Host "Packaged app works: thumbnail created"

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          LABEL: ${{ matrix.label }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          New-Item -ItemType Directory -Force release | Out-Null
          & $iscc /Qp "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\dist\$env:APP_NAME" `
            "/DOutputDir=$PWD\release" "/DOutputName=$env:APP_NAME-v$env:VERSION-$env:LABEL-setup" `
            packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer for signing (Windows)
        id: upload-unsigned-installer
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-${{ matrix.label }}
          path: release/*-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer (Windows)
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'offline-video-converter' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer

      - name: Use signed installer (Windows)
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          Get-ChildItem signed-installer -Filter *-setup.exe | ForEach-Object {
            Copy-Item $_.FullName "release\$($_.Name)" -Force
            $sig = Get-AuthenticodeSignature "release\$($_.Name)"
            Write-Host "$($_.Name): $($sig.Status) by $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { Write-Error "The installer is not validly signed"; exit 1 }
          }

      - name: Package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          LABEL: ${{ matrix.label }}
        run: |
          ARCHIVE="${APP_NAME}-v${VERSION}-${LABEL}"
          mkdir -p release
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Portable build: unzip the whole folder, then run OfflineVideoConverter.exe inside it.
            7z a -tzip "../release/${ARCHIVE}-portable.zip" "$APP_NAME" > /dev/null
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent "${APP_NAME}.app" "../release/${ARCHIVE}.zip"
          else
            tar -czf "../release/${ARCHIVE}.tar.gz" "$APP_NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [validate, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: build-*
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          FLAGS=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          if [ "$DRAFT" = "true" ]; then FLAGS+=(--draft); fi
          gh release create "$TAG" "${FLAGS[@]}" release/*
